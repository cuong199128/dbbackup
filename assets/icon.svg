<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B9CFF"/>
      <stop offset="100%" stop-color="#2F6FE0"/>
    </linearGradient>
    <linearGradient id="disk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#123a8f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- database cylinder (the thing being protected) -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="128" cy="88" rx="62" ry="22" fill="url(#disk)"/>
    <path d="M66 88 v52 c0 12.2 27.76 22 62 22 s62 -9.8 62 -22 v-52
             c0 12.2 -27.76 22 -62 22 s-62 -9.8 -62 -22 z" fill="url(#disk)"/>
    <path d="M66 118 v22 c0 12.2 27.76 22 62 22 s62 -9.8 62 -22 v-22
             c0 12.2 -27.76 22 -62 22 s-62 -9.8 -62 -22 z" fill="#c4d8ff"/>
    <ellipse cx="128" cy="88" rx="62" ry="22" fill="none" stroke="#2F6FE0" stroke-width="4" opacity="0.25"/>
  </g>

  <!-- circular badge with an upward arrow: backup / upload to cloud -->
  <circle cx="176" cy="176" r="52" fill="#1E8C3C" filter="url(#soft-shadow)"/>
  <circle cx="176" cy="176" r="52" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9"/>
  <path d="M176 152 v46 M158 170 l18 -18 l18 18"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
